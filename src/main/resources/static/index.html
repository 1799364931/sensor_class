<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>点击展开的侧边栏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <h2>选择日期</h2>
        <ul class="menu">
            <li class="menu-item">
                <span onclick="toggleMenu(this)">2025年 ▼</span>
                <ul class="submenu">
                    <li class="menu-item">
                        <span onclick="toggleMenu(this)">5月 ▼</span>
                        <ul class="submenu">
                            <li><span>1日</span></li>
                            <li><span>2日</span></li>
                            <li><span>3日</span></li>
                        </ul>
                    </li>
                    <li class="menu-item">
                        <span onclick="toggleMenu(this)">6月 ▼</span>
                        <ul class="submenu">
                            <li><span>10日</span></li>
                            <li><span>20日</span></li>
                        </ul>
                    </li>
                </ul>
            </li>
        </ul>
    </aside>

    <!-- 主内容区 -->
    <main class="content">
        <h1>欢迎访问</h1>
        <p>点击侧边栏中的菜单查看详情。</p>
    </main>
</div>

<script src="script.js"></script>

</body>
</html>
